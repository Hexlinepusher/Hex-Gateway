name: Workspace Skeleton Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  workspace-skeleton:
    name: Workspace skeleton
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check workspace skeleton files
        shell: bash
        run: |
          required_files=(
            "README.md"
            "LICENSE"
            "CHANGELOG.md"
            "CLAUDE.md"
            ".editorconfig"
            ".gitattributes"
            ".gitignore"
            "DOCUMENTS/TechStack.md"
            "DOCUMENTS/Commands.md"
            ".docs/wanto/README.md"
            ".docs/wanto/TEMPLATE.md"
            ".docs/design/README.md"
            ".docs/plan/README.md"
            ".docs/plan/TEMPLATE.md"
            ".docs/history/README.md"
            ".docs/history/TEMPLATE.md"
            ".docs/references/README.md"
            ".docs/trashcan/README.md"
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required file is missing"
              missing=1
            fi
          done

          exit "$missing"
